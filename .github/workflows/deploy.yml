name: synccount.ovh

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & push image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/synccount:latest
          echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH }}
          port: 2222
          script: |
            IMAGE=ghcr.io/${{ github.repository_owner }}/synccount:latest
            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull $IMAGE
            docker stop synccount || true
            docker rm synccount || true
            docker run -d --name synccount --restart unless-stopped \
              -p 3000:3000 \
              -e HOST=${{ secrets.HOST }} \
              $IMAGE
